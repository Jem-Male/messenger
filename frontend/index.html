<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Discord Clone - Вход</title>
    <!-- Подключаем наш файл стилей -->
    <link rel="stylesheet" href="./style.css"> 
</head>
<body>
    <div class="login-box">
        <h2>С возвращением!</h2>
        <p>Мы так рады видеть вас снова!</p>

        <!-- Тег form нужен, чтобы сгруппировать поля ввода. id нужен для JS -->
        <form id="loginForm">
            <label for="email">E-MAIL ИЛИ НОМЕР ТЕЛЕФОНА</label>
            <!-- required означает, что форму нельзя отправить пустой -->
            <input type="email" id="email" required>

            <label for="password">ПАРОЛЬ</label>
            <input type="password" id="password" required>

            <!-- type="submit" означает, что кнопка отправляет форму -->
            <button type="submit">Вход</button>
        </form>

        <!-- Сюда мы будем выводить ошибки красным текстом из JS -->
        <div id="errorText" class="error-text"></div>
    </div>

    <!-- Подключаем наш скрипт -->
    <script src="app.js"></script> 
</body>
</html>
